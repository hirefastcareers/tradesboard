<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <g fill="#21262B" fill-opacity="0.075">
    <!-- hammer -->
    <g transform="translate(18 22) rotate(-12)">
      <rect x="0" y="0" width="20" height="8" rx="1"/>
      <rect x="7" y="8" width="5" height="30" rx="1"/>
    </g>
    <!-- spanner -->
    <g transform="translate(88 18) rotate(22)">
      <path d="M5 7c0-3.2 2.2-5.5 5.2-5.5S15.5 3.8 15.5 7c0 1.4-.5 2.5-1.4 3.4L22 22l-4.2 4.2-7.8-7.8C9.1 19.2 8.1 19.5 7 19.5 3.8 19.5 1.5 17.2 1.5 14S3.8 8.5 7 8.5c.4 0 .8 0 1.2.1V7z"/>
    </g>
    <!-- paint roller -->
    <g transform="translate(24 88) rotate(8)">
      <rect x="0" y="0" width="28" height="10" rx="3"/>
      <rect x="22" y="10" width="4" height="14"/>
      <rect x="10" y="22" width="16" height="4" rx="1"/>
    </g>
    <!-- trowel -->
    <g transform="translate(100 78) rotate(-28)">
      <path d="M8 4 L28 18 L22 28 L2 14 Z"/>
      <rect x="-2" y="12" width="6" height="22" rx="1"/>
    </g>
    <!-- spirit level -->
    <g transform="translate(12 128) rotate(-6)">
      <rect x="0" y="0" width="42" height="8" rx="2"/>
      <rect x="15" y="1.5" width="12" height="5" rx="1" fill="#FAF7F2" fill-opacity="0.45"/>
    </g>
    <!-- hard hat -->
    <g transform="translate(108 118) rotate(10)">
      <ellipse cx="16" cy="14" rx="16" ry="6"/>
      <path d="M4 14 Q16 0 28 14 Z"/>
    </g>
    <!-- drill -->
    <g transform="translate(68 100) rotate(-18)">
      <rect x="8" y="0" width="18" height="14" rx="2"/>
      <rect x="0" y="5" width="10" height="4" rx="1"/>
      <rect x="22" y="4" width="14" height="3"/>
    </g>
