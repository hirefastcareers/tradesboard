<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!--
    Regular 9x9 lattice, cell centres every 40px starting at 20.
    Smaller icons, denser field; edge spacing matches internal spacing.
  -->
  <defs>
    <g id="hammer">
      <rect x="-5" y="-8" width="10" height="4" rx="0.5"/>
      <rect x="-1.5" y="-4" width="3" height="15" rx="0.5"/>
    </g>
    <g id="spanner">
      <path d="M-1 -5c0-1.8 1.2-3 2.8-3s2.8 1.2 2.8 3c0 .8-.3 1.4-.8 1.9L7 2.5 4.8 4.7.8.7C.4 1 0 1.1-.5 1.1c-1.8 0-3-1.2-3-3S-2.3-4.9-.5-4.9c.2 0 .4 0 .6.05V-5z"/>
    </g>
    <g id="roller">
      <rect x="-7" y="-6" width="13" height="4.5" rx="1.5"/>
      <rect x="3" y="-1.5" width="2" height="7"/>
      <rect x="-3" y="4" width="8" height="2" rx="0.5"/>
    </g>
    <g id="trowel">
      <path d="M-3 -5 L7 1 L4 6 L-6 0 Z"/>
      <rect x="-7" y="-1" width="2.5" height="10" rx="0.5"/>
    </g>
    <g id="level">
      <rect x="-10" y="-2" width="20" height="4" rx="1"/>
      <rect x="-3" y="-1" width="6" height="2" rx="0.4" fill="#FAF7F2" fill-opacity="0.55"/>
    </g>
    <g id="hat">
      <ellipse cx="0" cy="2" rx="8" ry="3"/>
      <path d="M-6 2 Q0 -6 6 2 Z"/>
    </g>
    <g id="drill">
      <rect x="-2" y="-4" width="8" height="6" rx="1"/>
      <rect x="-7" y="-1.5" width="5" height="2" rx="0.4"/>
      <rect x="5" y="-1" width="6" height="1.5"/>
    </g>
  </defs>

  <g fill="#21262B" fill-opacity="0.085">
    <!-- row y=20 -->
    <use href="#hammer" transform="translate(20 20) rotate(-14)"/>
    <use href="#spanner" transform="translate(60 20) rotate(22)"/>
    <use href="#roller" transform="translate(100 20) rotate(8)"/>
    <use href="#trowel" transform="translate(140 20) rotate(-24)"/>
    <use href="#level" transform="translate(180 20) rotate(-4)"/>
    <use href="#hat" transform="translate(220 20) rotate(12)"/>
    <use href="#drill" transform="translate(260 20) rotate(-18)"/>
    <use href="#hammer" transform="translate(300 20) rotate(16)"/>
    <use href="#spanner" transform="translate(340 20) rotate(-10)"/>

    <!-- row y=60 -->
    <use href="#level" transform="translate(20 60) rotate(6)"/>
    <use href="#hat" transform="translate(60 60) rotate(-12)"/>
    <use href="#drill" transform="translate(100 60) rotate(20)"/>
    <use href="#hammer" transform="translate(140 60) rotate(-8)"/>
    <use href="#spanner" transform="translate(180 60) rotate(14)"/>
    <use href="#roller" transform="translate(220 60) rotate(-20)"/>
    <use href="#trowel" transform="translate(260 60) rotate(10)"/>
    <use href="#level" transform="translate(300 60) rotate(18)"/>
    <use href="#hat" transform="translate(340 60) rotate(-16)"/>

    <!-- row y=100 -->
    <use href="#roller" transform="translate(20 100) rotate(-6)"/>
    <use href="#trowel" transform="translate(60 100) rotate(18)"/>
    <use href="#level" transform="translate(100 100) rotate(-14)"/>
    <use href="#hat" transform="translate(140 100) rotate(8)"/>
    <use href="#drill" transform="translate(180 100) rotate(-22)"/>
    <use href="#hammer" transform="translate(220 100) rotate(12)"/>
    <use href="#spanner" transform="translate(260 100) rotate(-8)"/>
    <use href="#roller" transform="translate(300 100) rotate(24)"/>
    <use href="#trowel" transform="translate(340 100) rotate(-18)"/>

    <!-- row y=140 -->
    <use href="#spanner" transform="translate(20 140) rotate(10)"/>
    <use href="#roller" transform="translate(60 140) rotate(-16)"/>
    <use href="#trowel" transform="translate(100 140) rotate(6)"/>
    <use href="#level" transform="translate(140 140) rotate(20)"/>
    <use href="#hat" transform="translate(180 140) rotate(-10)"/>
    <use href="#drill" transform="translate(220 140) rotate(14)"/>
    <use href="#hammer" transform="translate(260 140) rotate(-20)"/>
    <use href="#spanner" transform="translate(300 140) rotate(8)"/>
    <use href="#roller" transform="translate(340 140) rotate(-12)"/>

    <!-- row y=180 -->
    <use href="#hat" transform="translate(20 180) rotate(-8)"/>
    <use href="#drill" transform="translate(60 180) rotate(16)"/>
    <use href="#hammer" transform="translate(100 180) rotate(-18)"/>
    <use href="#spanner" transform="translate(140 180) rotate(10)"/>
    <use href="#roller" transform="translate(180 180) rotate(22)"/>
    <use href="#trowel" transform="translate(220 180) rotate(-14)"/>
    <use href="#level" transform="translate(260 180) rotate(4)"/>
    <use href="#hat" transform="translate(300 180) rotate(-22)"/>
    <use href="#drill" transform="translate(340 180) rotate(12)"/>

    <!-- row y=220 -->
    <use href="#trowel" transform="translate(20 220) rotate(14)"/>
    <use href="#level" transform="translate(60 220) rotate(-10)"/>
    <use href="#hat" transform="translate(100 220) rotate(18)"/>
    <use href="#drill" transform="translate(140 220) rotate(-6)"/>
    <use href="#hammer" transform="translate(180 220) rotate(20)"/>
    <use href="#spanner" transform="translate(220 220) rotate(-16)"/>
    <use href="#roller" transform="translate(260 220) rotate(8)"/>
    <use href="#trowel" transform="translate(300 220) rotate(-20)"/>
    <use href="#level" transform="translate(340 220) rotate(12)"/>

    <!-- row y=260 -->
    <use href="#drill" transform="translate(20 260) rotate(-12)"/>
    <use href="#hammer" transform="translate(60 260) rotate(8)"/>
    <use href="#spanner" transform="translate(100 260) rotate(-20)"/>
    <use href="#roller" transform="translate(140 260) rotate(14)"/>
    <use href="#trowel" transform="translate(180 260) rotate(-8)"/>
    <use href="#level" transform="translate(220 260) rotate(16)"/>
    <use href="#hat" transform="translate(260 260) rotate(-14)"/>
    <use href="#drill" transform="translate(300 260) rotate(10)"/>
    <use href="#hammer" transform="translate(340 260) rotate(-18)"/>

    <!-- row y=300 -->
    <use href="#roller" transform="translate(20 300) rotate(18)"/>
    <use href="#trowel" transform="translate(60 300) rotate(-12)"/>
    <use href="#level" transform="translate(100 300) rotate(8)"/>
    <use href="#hat" transform="translate(140 300) rotate(-16)"/>
    <use href="#drill" transform="translate(180 300) rotate(12)"/>
    <use href="#hammer" transform="translate(220 300) rotate(-10)"/>
    <use href="#spanner" transform="translate(260 300) rotate(20)"/>
    <use href="#roller" transform="translate(300 300) rotate(-8)"/>
    <use href="#trowel" transform="translate(340 300) rotate(14)"/>

    <!-- row y=340 -->
    <use href="#spanner" transform="translate(20 340) rotate(-16)"/>
    <use href="#roller" transform="translate(60 340) rotate(10)"/>
    <use href="#trowel" transform="translate(100 340) rotate(-18)"/>
    <use href="#level" transform="translate(140 340) rotate(6)"/>
    <use href="#hat" transform="translate(180 340) rotate(-12)"/>
    <use href="#drill" transform="translate(220 340) rotate(18)"/>
    <use href="#hammer" transform="translate(260 340) rotate(-6)"/>
    <use href="#spanner" transform="translate(300 340) rotate(14)"/>
    <use href="#roller" transform="translate(340 340) rotate(-20)"/>
  </g>
</svg>
