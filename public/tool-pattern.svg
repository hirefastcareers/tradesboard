<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    Regular 3x3 lattice, cell centres every 80px starting at 40.
    Edge-to-edge spacing matches internal spacing when tiled.
  -->
  <g fill="#21262B" fill-opacity="0.08">
    <!-- row 1 -->
    <g transform="translate(40 40) rotate(-16)">
      <!-- hammer -->
      <rect x="-10" y="-16" width="20" height="8" rx="1"/>
      <rect x="-3" y="-8" width="6" height="30" rx="1"/>
    </g>
    <g transform="translate(120 40) rotate(24)">
      <!-- spanner -->
      <path d="M-2 -9c0-3.2 2.2-5.5 5.2-5.5s5.2 2.3 5.2 5.5c0 1.4-.5 2.5-1.4 3.4L15 4.5 10.8 8.7 2.8 0.7C1.9 1.4 1 1.6 0 1.6c-3.2 0-5.5-2.3-5.5-5.5S-3.2-9.4 0-9.4c.4 0 .7 0 1.1.1V-9z"/>
    </g>
    <g transform="translate(200 40) rotate(10)">
      <!-- paint roller -->
      <rect x="-14" y="-12" width="26" height="9" rx="3"/>
      <rect x="6" y="-3" width="4" height="13"/>
      <rect x="-6" y="8" width="16" height="4" rx="1"/>
    </g>

    <!-- row 2 -->
    <g transform="translate(40 120) rotate(-26)">
      <!-- trowel -->
      <path d="M-6 -10 L14 2 L8 12 L-12 0 Z"/>
      <rect x="-14" y="-2" width="5" height="20" rx="1"/>
    </g>
    <g transform="translate(120 120) rotate(-6)">
      <!-- spirit level -->
      <rect x="-20" y="-4" width="40" height="8" rx="2"/>
      <rect x="-6" y="-2.5" width="12" height="5" rx="1" fill="#FAF7F2" fill-opacity="0.5"/>
    </g>
    <g transform="translate(200 120) rotate(14)">
      <!-- hard hat -->
      <ellipse cx="0" cy="4" rx="15" ry="5.5"/>
      <path d="M-11 4 Q0 -11 11 4 Z"/>
    </g>

    <!-- row 3 -->
    <g transform="translate(40 200) rotate(-20)">
      <!-- drill -->
      <rect x="-4" y="-8" width="16" height="12" rx="2"/>
      <rect x="-14" y="-3" width="10" height="4" rx="1"/>
      <rect x="10" y="-2" width="12" height="3"/>
    </g>
    <g transform="translate(120 200) rotate(18)">
      <!-- hammer (variant angle) -->
      <rect x="-9" y="-14" width="18" height="7" rx="1"/>
      <rect x="-2.5" y="-7" width="5" height="26" rx="1"/>
    </g>
    <g transform="translate(200 200) rotate(-12)">
      <!-- spanner (variant) -->
      <path d="M-2 -8c0-3 2-5 5-5s5 2 5 5c0 1.3-.4 2.3-1.3 3.1L14 4 10 8 2.5 0.5C1.7 1.1.9 1.4 0 1.4c-3 0-5-2-5-5s2-5 5-5c.3 0 .7 0 1 .1V-8z"/>
    </g>
  </g>
</svg>
